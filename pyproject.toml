[tool.poetry]
name = "video-processing-project"
version = "0.1.0"
description = "A video processing project using diffusion models"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "models"}, {include = "utils"}, {include = "stable_lora"}]

[tool.poetry.dependencies]
python = "^3.8"
accelerate = "0.21.0"
torch = "2.0.0"
torchvision = "*"
diffusers = "0.24.0"
transformers = "4.36.2"
einops = "*"
# decord = "*"  # Temporarily commented out due to installation issues
tqdm = "*"
safetensors = "*"
omegaconf = "*"
opencv-python = "*"
pydantic = "*"
compel = "*"
easydict = "*"
rotary-embedding-torch = "*"
imageio = {extras = ["ffmpeg"], version = "*"}
gradio = "*"
httpx = {extras = ["socks"], version = "*"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=models",
    "--cov=utils",
    "--cov=stable_lora",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=0",  # Set to 0 for infrastructure setup, change to 80 when adding actual tests
    "-vv",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["models", "utils", "stable_lora"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
show_missing = true
precision = 2
fail_under = 0  # Set to 0 for infrastructure setup, change to 80 when adding actual tests

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"